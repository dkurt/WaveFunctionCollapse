name: Test on RISC-V

on: [workflow_dispatch, pull_request]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          export PATH=/home/ubuntu/dotnet:$PATH
          dotnet build -c Release

      - name: Generate output
        run: ./bin/Release/WaveFunctionCollapse
